[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ustb"
version = "0.2.0"
description = "Python reimplementation of the UltraSound ToolBox (USTB) for beamforming, processing, and visualization of ultrasonic signals."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Ole Marius Hoel Rindal", email = "omrindal@ifi.uio.no" },
    { name = "USTB Contributors" },
]
keywords = ["ultrasound", "beamforming", "signal-processing", "medical-imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba>=0.59",
    "pyuff-ustb>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.2"]

[project.urls]
Homepage = "https://www.ustb.no"
Repository = "https://github.com/unioslo/USTB"
Documentation = "https://olemarius90.github.io/USTB/documentation.html"

[tool.hatch.build.targets.wheel]
packages = ["src/ustb"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["ustb", "examples"]
