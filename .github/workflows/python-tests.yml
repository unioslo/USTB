name: Python Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'python/**'

jobs:
  test:
    name: Python Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python / classifiers in python/pyproject.toml
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Datasets for the pixel-by-pixel comparison with the committed MATLAB
      # references (tests/test_ci_matlab_reference.py); one job is enough.
      - name: Cache datasets
        if: matrix.python-version == '3.12'
        uses: actions/cache@v4
        with:
          path: data
          key: ci-datasets-L7_CPWC_193328-PICMUS_experiment_resolution_distortion

      - name: Download datasets
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p data
          for f in L7_CPWC_193328.uff PICMUS_experiment_resolution_distortion.uff; do
            [ -f "data/$f" ] || curl -fL --retry 3 -o "data/$f" "https://zenodo.org/records/20261898/files/$f"
          done

      - name: Install package with dev dependencies
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: python
        run: pytest tests/ -v -rs
